<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Memory Book</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"
  ></script>

</head>


<body>


  <div class="background"></div>


  <div class="book-wrapper">

    <div
      id="book"
      class="book"
    >


      <!-- ปกหน้า -->

      <div
        class="page cover"
        data-density="hard"
      >

        <img
          src="images/1.png"
          alt="ปกหน้า"
        >

      </div>


      <!-- หน้า 2 -->

      <div class="page">

        <img
          src="images/2.png"
          alt="หน้า 2"
        >

      </div>


      <!-- หน้า 3 -->

      <div class="page">

        <img
          src="images/3.png"
          alt="หน้า 3"
        >

      </div>


      <!-- หน้า 4 -->

      <div class="page">

        <img
          src="images/4.png"
          alt="หน้า 4"
        >

      </div>


      <!-- หน้า 5 -->

      <div class="page">

        <img
          src="images/5.png"
          alt="หน้า 5"
        >

      </div>


      <!-- หน้า 6 -->

      <div class="page">

        <img
          src="images/6.png"
          alt="หน้า 6"
        >

      </div>


      <!-- หน้า 7 -->

      <div class="page">

        <img
          src="images/7.png"
          alt="หน้า 7"
        >

      </div>


      <!-- หน้า 8 -->

      <div class="page">

        <img
          src="images/8.png"
          alt="หน้า 8"
        >

      </div>


      <!-- หน้า 9 -->

      <div class="page">

        <img
          src="images/9.png"
          alt="หน้า 9"
        >

      </div>


      <!-- หน้า 10 -->

      <div class="page">

        <img
          src="images/10.png"
          alt="หน้า 10"
        >

      </div>


      <!-- หน้า 11 -->

      <div class="page">

        <img
          src="images/11.png"
          alt="หน้า 11"
        >

      </div>


      <!-- หน้า 12 -->

      <div class="page">

        <img
          src="images/12.png"
          alt="หน้า 12"
        >

      </div>


      <!-- หน้า 13 -->

      <div class="page">

        <img
          src="images/13.png"
          alt="หน้า 13"
        >

      </div>


      <!-- ปกหลัง -->

      <div
        class="page cover"
        data-density="hard"
      >

        <img
          src="images/14.png"
          alt="ปกหลัง"
        >

      </div>


    </div>

  </div>


  <div class="controls">

    <span id="pageNum">
      1 / 14
    </span>

  </div>


  <script
    src="js/script.js"
  ></script>


</body>

</html>
